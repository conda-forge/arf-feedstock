context:
  version: "0.5.2"

package:
  name: arf
  version: ${{ version }}

source:
  url: https://github.com/eitsupi/arf/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 34647ecda535521c18dd26dc2b609c390b02876f47e76d661750bb44ca9fc602

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
      # instruct `cc` crate to use clang-cl natively to compile build-time tools intended to be run on the host when cross-compiling from `win_64`
      AR_x86_64_pc_windows_msvc: llvm-lib
      CC_x86_64_pc_windows_msvc: clang-cl
      CXX_x86_64_pc_windows_msvc: clang-cl
    interpreter: nu
    content:
      - let prefix = $env.LIBRARY_PREFIX? | default $env.PREFIX
      # build main app and generate license data
      - cd crates/arf-console
      - cargo auditable install --path=. --root=($prefix) --no-track --locked --bins
      - cargo-bundle-licenses --format=yaml --output=../../THIRDPARTY.yml
      # generate shell completions
      - if: build_platform == host_platform
        then:
          - mkdir ($prefix)/share/bash-completion/completions ($prefix)/share/fish/vendor_completions.d ($prefix)/share/zsh/site-functions
          - let bin = ($prefix)/bin/arf
          - ^$bin completions bash | save ($prefix)/share/bash-completion/completions/arf
          - ^$bin completions fish | save ($prefix)/share/fish/vendor_completions.d/arf.fish
          - ^$bin completions zsh  | save ($prefix)/share/zsh/site-functions/_arf

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - nushell

tests:
  - script:
      - arf --help
      - arf --version
  - package_contents:
      bin:
        - arf
      files:
        - if: unix and build_platform == host_platform
          then:
            - share/bash-completion/completions/arf
            - share/fish/vendor_completions.d/arf.fish
            - share/zsh/site-functions/_arf
        - if: win and build_platform == host_platform
          then:
            - Library/share/bash-completion/completions/arf
            - Library/share/fish/vendor_completions.d/arf.fish
            - Library/share/zsh/site-functions/_arf
      strict: true

about:
  summary: Alternative R Frontend — a cross-platform R console written in Rust
  description: |
    arf is a cross-platform R console written in Rust. It is a single binary
    with no runtime dependencies, offering Vi/Emacs editing modes, multiline
    editing with proper indentation, auto-matching brackets and quotes, tab
    completion for R objects/functions/file paths, fzf-style history search,
    customizable keyboard shortcuts, a fuzzy help browser, tree-sitter based
    syntax highlighting, reprex mode, shell mode, and an IPC server for AI
    agent and CI integration. It also integrates with
    [rig](https://r-lib.github.io/rig/) to switch R versions on the fly.
  license: MIT
  license_file:
    - LICENSE.md
    - THIRDPARTY.yml
  homepage: https://github.com/eitsupi/arf
  repository: https://github.com/eitsupi/arf

extra:
  recipe-maintainers:
    - salim-b
